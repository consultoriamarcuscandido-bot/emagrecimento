<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Consultoria de Treinamento — Painel do Coach</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brown:#5C2E1A;--brown2:#7A3E26;--brown-light:#F5EDE6;
  --beige:#E8D5C0;--beige2:#F5EDE6;
  --teal:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --amber:#BA7517;--amber-light:#FAEEDA;
  --red:#E24B4A;--red-light:#FCEBEB;
  --bg:#ffffff;--bg2:#faf7f4;--bg3:#f2ebe3;
  --text:#2C1810;--text2:#7A5C4E;--text3:#B09080;
  --border:rgba(92,46,26,0.15);--border2:rgba(92,46,26,0.28);
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1210;--bg2:#221810;--bg3:#2e1e14;--text:#F5EDE6;--text2:#C4A090;--text3:#8A6A5A;--border:rgba(232,213,192,0.15);--border2:rgba(232,213,192,0.28);}
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
.topnav{background:var(--brown);padding:0 1.5rem;display:flex;align-items:center;gap:1rem;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(92,46,26,0.3)}
.topnav-logo{display:flex;align-items:center;gap:10px}
.topnav-logo img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--beige)}
.topnav-brand{font-size:15px;font-weight:600;color:var(--beige)}
.topnav-brand span{color:rgba(232,213,192,0.7);font-weight:400;font-size:12px;display:block;margin-top:1px}
.topnav-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.container{max-width:960px;margin:0 auto;padding:1.5rem}
.page{display:none}.page.active{display:block}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.metric{background:var(--bg2);border-radius:var(--radius);padding:1rem;border:0.5px solid var(--border)}
.metric-num{font-size:26px;font-weight:600;color:var(--text)}
.metric-lbl{font-size:12px;color:var(--text3);margin-top:2px}
.section-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:1.25rem 0 .6rem}
.btn{padding:8px 16px;border:0.5px solid var(--border2);border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;color:var(--text);font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--brown-light);border-color:var(--brown);color:var(--brown)}
.btn-primary:hover{background:var(--beige)}
.btn-sm{padding:5px 10px;font-size:12px}
.badge{padding:3px 9px;border-radius:100px;font-size:11px;font-weight:500}
.badge-green{background:var(--teal-light);color:var(--teal-dark)}
.badge-amber{background:var(--amber-light);color:var(--amber)}
.badge-red{background:var(--red-light);color:var(--red)}
.student-row{display:grid;grid-template-columns:auto 1fr 120px 80px 80px;align-items:center;gap:14px;padding:12px 14px;border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:6px;background:var(--bg);cursor:pointer;transition:background .12s}
.student-row:hover{background:var(--bg2)}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.pbar-wrap{height:5px;border-radius:100px;background:var(--border);overflow:hidden}
.pbar{height:5px;border-radius:100px}
.filter-bar{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.filter-btn{padding:5px 12px;font-size:12px;border:0.5px solid var(--border);border-radius:100px;background:transparent;cursor:pointer;color:var(--text2);font-family:inherit}
.filter-btn.active{background:var(--bg2);color:var(--text);border-color:var(--border2);font-weight:500}
.alert-bar{padding:9px 13px;border-radius:var(--radius);font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:8px;border:0.5px solid}
.alert-warn{background:var(--amber-light);color:var(--amber);border-color:#EF9F27}
.search-wrap{position:relative;margin-bottom:1rem}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
.search-wrap input:focus{outline:none;border-color:var(--brown)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px}
.modal-overlay{position:fixed;inset:0;background:rgba(44,24,16,0.5);display:none;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:1.5rem;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;font-weight:600;margin-bottom:1.25rem;color:var(--brown)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--brown)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:0.5px solid var(--border)}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);cursor:pointer;background:none;border:none;font-family:inherit;margin-bottom:1.25rem;padding:0}
.back-btn:hover{color:var(--text)}
.link-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--text2);word-break:break-all;font-family:monospace;margin:6px 0}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--brown);color:var(--beige);padding:10px 18px;border-radius:var(--radius);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--brown);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
code{font-family:monospace;font-size:11px;background:var(--bg2);padding:2px 5px;border-radius:4px}
.config-step{display:flex;gap:12px;padding:14px;border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--brown-light);color:var(--brown);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.hero-banner{background:var(--brown);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:14px}
.hero-banner img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--beige);flex-shrink:0}
.hero-banner h2{font-size:18px;font-weight:600;color:var(--beige)}
.hero-banner p{font-size:13px;color:rgba(232,213,192,0.75);margin-top:2px}
/* Detail tabs */
.detail-tabs{display:flex;gap:4px;margin-bottom:1.25rem;border-bottom:0.5px solid var(--border);padding-bottom:0}
.detail-tab{padding:8px 16px;font-size:13px;border:none;background:transparent;cursor:pointer;color:var(--text2);font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px}
.detail-tab.active{color:var(--brown);border-bottom-color:var(--brown);font-weight:600}
.detail-tab-content{display:none}.detail-tab-content.active{display:block}
/* Week accordion */
.week-block{border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.week-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:var(--bg2);user-select:none}
.week-header:hover{background:var(--beige2)}
.week-title{font-size:13px;font-weight:600;color:var(--text)}
.week-summary{font-size:12px;color:var(--text3)}
.week-body{display:none;padding:0}
.week-body.open{display:block}
/* Day row */
.day-detail{padding:12px 14px;border-top:0.5px solid var(--border);background:var(--bg)}
.day-detail-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.day-name{font-size:13px;font-weight:600;color:var(--text2);width:32px}
.day-pct{font-size:12px;color:var(--text3);margin-left:auto}
/* Check grid */
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px;margin-bottom:6px}
.check-pill{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:100px;border:0.5px solid}
.check-pill.done{background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark)}
.check-pill.skip{background:var(--red-light);border-color:var(--red);color:var(--red)}
.check-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.check-dot.done{background:var(--teal)}
.check-dot.skip{background:var(--red)}
/* Nota */
.nota-box{background:var(--beige2);border:0.5px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--text2);line-height:1.6;margin-top:6px;font-style:italic}
.nota-box::before{content:"📝 ";font-style:normal}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem}
@media(max-width:640px){
  .metric-grid{grid-template-columns:1fr 1fr}
  .student-row{grid-template-columns:auto 1fr auto}
  .check-grid{grid-template-columns:1fr 1fr}
  .detail-grid{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>

<script>
const SUPABASE_URL = 'https://dkolfpsmhcyjpauqqyrc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_V9iiLYGokz0-LkmBTh1SHg_scldxvoH';
const BASE_URL = window.location.origin + window.location.pathname.replace('coach.html','');

async function sb(table,method='GET',body=null,filter=''){
  if(!SUPABASE_URL.includes('supabase')){showToast('Configure o Supabase primeiro!');throw new Error('nc')}
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${table}${filter}`,{method,headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':''},body:body?JSON.stringify(body):null});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||`Erro ${res.status}`)}
  return res.status===204?null:res.json();
}

const CHECKS_DEF=[
  {id:'agua',icon:'💧',label:'Água (2–3L)'},
  {id:'sono',icon:'😴',label:'Sono 7h+'},
  {id:'plano',icon:'🥗',label:'Plano alimentar'},
  {id:'acucar',icon:'🚫',label:'Sem açúcar'},
  {id:'alcool',icon:'🍺',label:'Sem álcool'},
  {id:'muscu',icon:'🏋️',label:'Musculação'},
  {id:'cardio',icon:'🏃',label:'Aeróbico'},
  {id:'mobilidade',icon:'🧘',label:'Mobilidade'},
  {id:'mente',icon:'🧠',label:'Compromissos'},
  {id:'consistencia',icon:'🔥',label:'Consistência'},
];
const DIAS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const CORES=[{bg:'#F5EDE6',text:'#5C2E1A'},{bg:'#E6F1FB',text:'#0C447C'},{bg:'#E1F5EE',text:'#085041'},{bg:'#FAEEDA',text:'#633806'},{bg:'#FBEAF0',text:'#4B1528'}];

let alunos=[],checkins={},filterMode='todos',lastLink='',lastAlunoNome='',curDetailId=null;

function initials(n){return n.trim().split(' ').map(x=>x[0]).filter(Boolean).slice(0,2).join('').toUpperCase()}
function cor(i){return CORES[i%CORES.length]}
function statusInfo(p){if(p>=75)return{label:'Ótimo',cls:'badge-green'};if(p>=50)return{label:'Regular',cls:'badge-amber'};return{label:'Atenção',cls:'badge-red'}}

function calcAdesao(id){
  const rows=checkins[id]||[];
  if(!rows.length)return{pct:0,semanaAtual:1,streak:0,diasAtivos:0};
  let ts=0,dias=0;
  rows.forEach(r=>{const s=Object.values(r.checks||{}).filter(Boolean).length;ts+=s/10;if(s>0)dias++;});
  const pct=Math.round(ts/Math.max(rows.length,1)*100);
  const maxS=Math.max(...rows.map(r=>r.semana));
  let streak=0;
  const sorted=rows.filter(r=>Object.values(r.checks||{}).filter(Boolean).length>=7).sort((a,b)=>b.semana*7+b.dia-(a.semana*7+a.dia));
  if(sorted.length){let prev=sorted[0].semana*7+sorted[0].dia;streak=1;for(let i=1;i<sorted.length;i++){const c=sorted[i].semana*7+sorted[i].dia;if(prev-c===1){streak++;prev=c;}else break;}}
  return{pct,semanaAtual:maxS,streak,diasAtivos:dias};
}

async function loadAlunos(){
  const icon=document.getElementById('refresh-icon');icon.innerHTML='<span class="spinner"></span>';
  try{
    alunos=await sb('alunos','GET',null,'?order=criado_em.desc&ativo=eq.true');
    const all=await sb('checkins','GET',null,'?order=semana.asc,dia.asc');
    checkins={};(all||[]).forEach(c=>{if(!checkins[c.aluno_id])checkins[c.aluno_id]=[];checkins[c.aluno_id].push(c);});
    updateMetrics();renderList();renderAlertas();
    if(curDetailId) renderDetail(curDetailId);
  }catch(e){if(e.message!=='nc')showToast('Erro: '+e.message);}
  icon.innerHTML='↻';
}

function updateMetrics(){
  document.getElementById('m-total').textContent=alunos.length;
  document.getElementById('m-ativos').textContent=alunos.filter(a=>a.ativo).length;
  const s=alunos.map(a=>calcAdesao(a.id).pct);
  document.getElementById('m-otimos').textContent=s.filter(p=>p>=75).length;
  document.getElementById('m-atencao').textContent=s.filter(p=>p<50).length;
}

function renderAlertas(){
  document.getElementById('alertas-wrap').innerHTML=alunos.filter(a=>calcAdesao(a.id).pct<50&&a.ativo).map(a=>{
    const{pct}=calcAdesao(a.id);
    return `<div class="alert-bar alert-warn">⚠ <strong>${a.nome}</strong> — adesão de ${pct}% esta semana. <a href="https://wa.me/55${(a.whatsapp||'').replace(/\D/g,'')}" target="_blank" style="color:var(--amber);margin-left:4px">📱 WhatsApp</a></div>`;
  }).join('');
}

function setFilter(mode,btn){filterMode=mode;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderList();}

function renderList(){
  const q=(document.getElementById('search-input').value||'').toLowerCase();
  let lista=alunos.filter(a=>a.ativo);
  if(q)lista=lista.filter(a=>a.nome.toLowerCase().includes(q));
  if(filterMode==='otimo')lista=lista.filter(a=>calcAdesao(a.id).pct>=75);
  if(filterMode==='regular')lista=lista.filter(a=>{const p=calcAdesao(a.id).pct;return p>=50&&p<75;});
  if(filterMode==='atencao')lista=lista.filter(a=>calcAdesao(a.id).pct<50);
  if(!lista.length){document.getElementById('student-list').innerHTML='<div style="text-align:center;padding:3rem;color:var(--text3)">Nenhum aluno encontrado.</div>';return;}
  document.getElementById('student-list').innerHTML=lista.map((a)=>{
    const{pct,semanaAtual,streak}=calcAdesao(a.id);
    const st=statusInfo(pct);const c=cor(alunos.indexOf(a));
    const barColor=pct>=75?'var(--teal)':pct>=50?'var(--amber)':'var(--red)';
    const rows=checkins[a.id]||[];
    const last7=rows.slice(-7);
    const heat=Array.from({length:7},(_,j)=>{const r=last7[j];const s=r?Object.values(r.checks||{}).filter(Boolean).length/10:0;const bg=s>=1?'#1D9E75':s>=0.7?'#5DCAA5':s>=0.4?'#9FE1CB':s>0?'#E1F5EE':'var(--border)';return `<div style="width:10px;height:10px;border-radius:2px;background:${bg}"></div>`;}).join('');
    return `<div class="student-row" onclick="showDetail('${a.id}')">
      <div class="avatar" style="background:${c.bg};color:${c.text}">${initials(a.nome)}</div>
      <div><div style="font-size:14px;font-weight:500">${a.nome}</div><div style="font-size:12px;color:var(--text2);margin-top:1px">Semana ${semanaAtual} · ${streak} dias seguidos</div></div>
      <div><div style="display:flex;gap:2px;margin-bottom:4px">${heat}</div><div class="pbar-wrap"><div class="pbar" style="width:${pct}%;background:${barColor}"></div></div><div style="font-size:10px;color:var(--text3);margin-top:2px;text-align:right">${pct}%</div></div>
      <span class="badge ${st.cls}">${st.label}</span>
    </div>`;
  }).join('');
}

function showDetail(id){
  curDetailId=id;
  renderDetail(id);
  showPage('detail');
  switchTab('resumo', document.querySelector('.detail-tab'));
}

function renderDetail(id){
  const a=alunos.find(x=>x.id===id);if(!a)return;
  const{pct,semanaAtual,streak,diasAtivos}=calcAdesao(id);
  const st=statusInfo(pct);const c=cor(alunos.indexOf(a));
  const rows=checkins[id]||[];
  const link=`${BASE_URL}aluno.html?id=${id}`;

  // HEADER
  document.getElementById('detail-header').innerHTML=`
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:1rem">
      <div class="avatar" style="width:52px;height:52px;font-size:18px;background:${c.bg};color:${c.text}">${initials(a.nome)}</div>
      <div style="flex:1">
        <div style="font-size:20px;font-weight:600">${a.nome}</div>
        <div style="font-size:13px;color:var(--text2);margin-top:2px">${a.objetivo||'Sem objetivo'} · início ${a.semana_inicio?new Date(a.semana_inicio+'T12:00:00').toLocaleDateString('pt-BR'):'—'}</div>
      </div>
      <span class="badge ${st.cls}" style="font-size:13px;padding:5px 12px">${st.label}</span>
    </div>`;

  // ABA RESUMO
  const heatmap=Array.from({length:12},(_,w)=>Array.from({length:7},(_,d)=>{
    const r=rows.find(x=>x.semana===w+1&&x.dia===d);
    const s=r?Object.values(r.checks||{}).filter(Boolean).length/10:0;
    const bg=s>=1?'#1D9E75':s>=0.7?'#5DCAA5':s>=0.4?'#9FE1CB':s>0?'#E1F5EE':'var(--border)';
    return `<div style="aspect-ratio:1;border-radius:3px;background:${bg}" title="Sem ${w+1} ${DIAS[d]}: ${Math.round(s*100)}%"></div>`;
  }).join('')).join('');
  document.getElementById('tab-resumo').innerHTML=`
    <div class="detail-grid">
      <div class="metric"><div class="metric-num" style="color:${pct>=75?'var(--teal)':pct>=50?'var(--amber)':'var(--red)'}">${pct}%</div><div class="metric-lbl">adesão geral</div></div>
      <div class="metric"><div class="metric-num">${streak}</div><div class="metric-lbl">dias seguidos</div></div>
      <div class="metric"><div class="metric-num">${diasAtivos}</div><div class="metric-lbl">dias ativos</div></div>
      <div class="metric"><div class="metric-num">Sem ${semanaAtual}</div><div class="metric-lbl">semana atual</div></div>
      <div class="metric"><div class="metric-num">${a.peso_inicial||'—'} kg</div><div class="metric-lbl">peso inicial</div></div>
      <div class="metric"><div class="metric-num">${rows.length}</div><div class="metric-lbl">check-ins</div></div>
    </div>
    <p class="section-lbl">Heatmap — 12 semanas</p>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:4px"><span>Sem 1</span><span>Sem 12</span></div>
    <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-bottom:.5rem">${heatmap}</div>
    <div style="display:flex;gap:10px;font-size:11px;color:var(--text3);margin-bottom:1.5rem">
      <span>■ 100%</span><span style="color:#5DCAA5">■ 70%+</span><span style="color:#9FE1CB">■ 40%+</span><span>■ 0%</span>
    </div>`;

  // ABA DIA A DIA
  let semanasDia='';
  for(let w=semanaAtual;w>=1;w--){
    const semRows=rows.filter(r=>r.semana===w);
    if(!semRows.length)continue;
    const semPcts=semRows.map(r=>Object.values(r.checks||{}).filter(Boolean).length/10*100);
    const semAvg=Math.round(semPcts.reduce((a,b)=>a+b,0)/Math.max(semRows.length,1));
    const barC=semAvg>=75?'var(--teal)':semAvg>=50?'var(--amber)':'var(--red)';
    let daysHtml='';
    for(let d=0;d<7;d++){
      const r=semRows.find(x=>x.dia===d);
      if(!r)continue;
      const checks=r.checks||{};
      const score=Object.values(checks).filter(Boolean).length;
      const pctDia=Math.round(score/10*100);
      const doneChecks=CHECKS_DEF.filter(c=>checks[c.id]);
      const skipChecks=CHECKS_DEF.filter(c=>!checks[c.id]);
      const doneHtml=doneChecks.map(c=>`<span class="check-pill done"><span class="check-dot done"></span>${c.icon} ${c.label}</span>`).join('');
      const skipHtml=skipChecks.map(c=>`<span class="check-pill skip"><span class="check-dot skip"></span>${c.icon} ${c.label}</span>`).join('');
      const notaHtml=r.nota&&r.nota.trim()?`<div class="nota-box">${r.nota.replace(/</g,'&lt;')}</div>`:'';
      const barColor=pctDia>=75?'var(--teal)':pctDia>=50?'var(--amber)':'var(--red)';
      daysHtml+=`<div class="day-detail">
        <div class="day-detail-header">
          <span class="day-name">${DIAS[d]}</span>
          <div style="flex:1;height:5px;border-radius:100px;background:var(--border);overflow:hidden;max-width:120px;margin:0 10px"><div style="width:${pctDia}%;height:5px;background:${barColor};border-radius:100px"></div></div>
          <span class="day-pct">${score}/10 · ${pctDia}%</span>
        </div>
        ${doneHtml?`<div class="check-grid" style="margin-bottom:4px">${doneHtml}</div>`:''}
        ${skipHtml?`<div class="check-grid">${skipHtml}</div>`:''}
        ${notaHtml}
      </div>`;
    }
    semanasDia+=`<div class="week-block">
      <div class="week-header" onclick="toggleWeek(this)">
        <div>
          <span class="week-title">Semana ${w}</span>
          <span class="week-summary" style="margin-left:10px">· ${semAvg}% adesão · ${semRows.length} dias registrados</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:80px;height:4px;border-radius:100px;background:var(--border);overflow:hidden"><div style="width:${semAvg}%;height:4px;background:${barC};border-radius:100px"></div></div>
          <span style="font-size:13px;color:var(--text3)">▾</span>
        </div>
      </div>
      <div class="week-body${w===semanaAtual?' open':''}">${daysHtml}</div>
    </div>`;
  }
  document.getElementById('tab-semanas').innerHTML=semanasDia||'<p style="color:var(--text3);font-size:13px;padding:1rem 0">Nenhum check-in registrado ainda.</p>';

  // ABA ANOTAÇÕES
  const notasRows=rows.filter(r=>r.nota&&r.nota.trim()!=='').sort((a,b)=>b.semana*7+b.dia-(a.semana*7+a.dia));
  document.getElementById('tab-notas').innerHTML=notasRows.length?
    notasRows.map(r=>{
      const score=Object.values(r.checks||{}).filter(Boolean).length;
      const pctDia=Math.round(score/10*100);
      const barColor=pctDia>=75?'var(--teal)':pctDia>=50?'var(--amber)':'var(--red)';
      return `<div style="padding:14px;border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:var(--bg)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:13px;font-weight:600;color:var(--brown)">Semana ${r.semana} · ${DIAS[r.dia]}</span>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:60px;height:4px;border-radius:100px;background:var(--border);overflow:hidden"><div style="width:${pctDia}%;height:4px;background:${barColor};border-radius:100px"></div></div>
            <span style="font-size:11px;color:var(--text3)">${pctDia}% adesão</span>
          </div>
        </div>
        <p style="font-size:13px;color:var(--text);line-height:1.7;font-style:italic">"${r.nota.replace(/</g,'&lt;')}"</p>
      </div>`;
    }).join('')
    :'<p style="color:var(--text3);font-size:13px;padding:1rem 0">Nenhuma anotação registrada ainda.</p>';

  // ABA CONTATO & LINK
  document.getElementById('tab-config').innerHTML=`
    <p class="section-lbl">Contato</p>
    <div style="display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap">
      ${a.whatsapp?`<a href="https://wa.me/55${a.whatsapp.replace(/\D/g,'')}" target="_blank" class="btn btn-sm">📱 ${a.whatsapp}</a>`:'<span style="font-size:13px;color:var(--text3)">WhatsApp não cadastrado</span>'}
      ${a.email?`<a href="mailto:${a.email}" class="btn btn-sm">✉ ${a.email}</a>`:''}
    </div>
    <p class="section-lbl">Link do aluno</p>
    <div class="link-box">${link}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem">
      <button class="btn btn-sm" onclick="navigator.clipboard.writeText('${link}').then(()=>showToast('Link copiado!'))">📋 Copiar</button>
      <button class="btn btn-sm btn-primary" onclick="window.open('https://wa.me/55${(a.whatsapp||'').replace(/\D/g,'')}?text='+encodeURIComponent('Olá ${a.nome}! Seu checklist MC Consultoria:\n${link}'))">📱 WhatsApp</button>
    </div>
    <p class="section-lbl" style="margin-top:1.5rem">Ações</p>
    <button class="btn btn-sm" onclick="toggleAtivo('${id}',false)" style="color:var(--amber);border-color:var(--amber)">⏸ Desativar aluno</button>
      <button class="btn btn-sm" onclick="if(confirm('Excluir permanentemente?')){excluirAluno('${id}')}" style="color:var(--red);border-color:var(--red)">🗑️ Excluir</button>`;
}

function switchTab(name, btn){
  document.querySelectorAll('.detail-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.detail-tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  const tabs=document.querySelectorAll('.detail-tab');
  const map={resumo:0,semanas:1,notas:2,'config':3};
  tabs[map[name]]?.classList.add('active');
}

function toggleWeek(header){
  const body=header.nextElementSibling;
  body.classList.toggle('open');
}

async function toggleAtivo(id,ativo){try{await sb('alunos','PATCH',{ativo},`?id=eq.${id}`);showToast(ativo?'Reativado!':'Desativado.');await loadAlunos();backToList();}catch(e){showToast('Erro: '+e.message);}}
async function excluirAluno(id){try{await sb('checkins','DELETE',null,'?aluno_id=eq.'+id);await sb('monitoramento','DELETE',null,'?aluno_id=eq.'+id);await sb('alunos','DELETE',null,'?id=eq.'+id);showToast('Aluno excluído!');alunos=alunos.filter(a=>a.id!==id);checkins[id]=[];renderList();updateMetrics();backToList();}catch(e){showToast('Erro: '+e.message);}}
function openAddAluno(){document.getElementById('f-inicio').value=new Date().toISOString().split('T')[0];openModal('modal-add');}

async function addAluno(){
  const nome=document.getElementById('f-nome').value.trim();if(!nome){showToast('Digite o nome');return;}
  const btn=document.getElementById('btn-add');btn.innerHTML='<span class="spinner"></span>';btn.disabled=true;
  try{
    const[novo]=await sb('alunos','POST',{nome,whatsapp:document.getElementById('f-whats').value,email:document.getElementById('f-email').value,peso_inicial:parseFloat(document.getElementById('f-peso').value)||null,objetivo:document.getElementById('f-obj').value,semana_inicio:document.getElementById('f-inicio').value});
    closeModal('modal-add');lastLink=`${BASE_URL}aluno.html?id=${novo.id}`;lastAlunoNome=nome;
    document.getElementById('link-gerado').textContent=lastLink;openModal('modal-link');
    await loadAlunos();
    ['f-nome','f-whats','f-email','f-peso','f-obj'].forEach(id=>document.getElementById(id).value='');
  }catch(e){showToast('Erro: '+e.message);}
  btn.innerHTML='+ Cadastrar e gerar link';btn.disabled=false;
}

function copyLink(){navigator.clipboard.writeText(lastLink).then(()=>showToast('Copiado!'));}
function sendWhatsApp(){const num=alunos.find(a=>a.nome===lastAlunoNome)?.whatsapp?.replace(/\D/g,'')||'';window.open(`https://wa.me/55${num}?text=${encodeURIComponent(`Olá ${lastAlunoNome}! Seu checklist MC Consultoria:\n${lastLink}`)}`);}

function openConfig(){document.getElementById('cfg-url').value=localStorage.getItem('sb_url')||'';document.getElementById('cfg-key').value=localStorage.getItem('sb_key')||'';showPage('config');}
async function saveConfig(){
  const url=document.getElementById('cfg-url').value.trim(),key=document.getElementById('cfg-key').value.trim();
  if(!url||!key){showToast('Preencha URL e chave');return;}
  localStorage.setItem('sb_url',url);localStorage.setItem('sb_key',key);location.reload();
}

function showPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+n).classList.add('active');}
function backToList(){curDetailId=null;showPage('list');}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

document.getElementById('today-label').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
loadAlunos();
</script>
</body>
</html>
