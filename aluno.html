<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MC Consultoria — Meu Checklist</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --brown:#5C2E1A;--brown2:#7A3E26;--brown-light:#F5EDE6;--beige:#E8D5C0;
    --teal:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
    --amber:#BA7517;--amber-light:#FAEEDA;--red:#E24B4A;
    --bg:#ffffff;--bg2:#faf7f4;--bg3:#f2ebe3;
    --text:#2C1810;--text2:#7A5C4E;--text3:#B09080;
    --border:rgba(92,46,26,0.15);--border2:rgba(92,46,26,0.28);
    --radius:8px;--radius-lg:12px;
  }
  @media(prefers-color-scheme:dark){
    :root{--bg:#1a1210;--bg2:#221810;--bg3:#2e1e14;--text:#F5EDE6;--text2:#C4A090;--text3:#8A6A5A;--border:rgba(232,213,192,0.15);--border2:rgba(232,213,192,0.28);}
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
  .topbar{background:var(--brown);padding:12px 16px;position:sticky;top:0;z-index:50}
  .topbar-inner{max-width:520px;margin:0 auto}
  .aluno-header{display:flex;align-items:center;gap:10px}
  .brand-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid var(--beige);flex-shrink:0}
  .aluno-nome{font-size:15px;font-weight:600;color:var(--beige)}
  .aluno-sub{font-size:12px;color:rgba(232,213,192,0.7);margin-top:1px}
  .progress-bar-outer{height:4px;background:rgba(232,213,192,0.25);border-radius:100px;margin-top:10px;overflow:hidden}
  .progress-bar-inner{height:4px;border-radius:100px;background:var(--beige);transition:width .35s}
  .container{max-width:520px;margin:0 auto;padding:1rem 16px 5rem}
  .nav-weeks{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .nav-btn{padding:6px 14px;border:0.5px solid var(--border2);border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;color:var(--text);font-family:inherit}
  .nav-btn:hover{background:var(--bg2)}
  .week-label{font-size:15px;font-weight:600;color:var(--brown)}
  .day-strip{display:flex;gap:5px;overflow-x:auto;margin-bottom:1rem;padding-bottom:2px}
  .day-btn{flex-shrink:0;min-width:42px;padding:7px 6px;text-align:center;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:11px;color:var(--text2);font-family:inherit;transition:all .12s;position:relative}
  .day-btn.active{border-color:var(--brown);background:var(--brown-light);color:var(--brown);font-weight:600}
  .day-btn.done{border-color:var(--teal)}
  .day-btn.done::after{content:'';width:5px;height:5px;background:var(--teal);border-radius:50%;position:absolute;top:4px;right:4px}
  .score-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem}
  .score-card{background:var(--bg);border-radius:var(--radius);padding:10px 12px;border:0.5px solid var(--border)}
  .score-num{font-size:20px;font-weight:600;color:var(--brown)}
  .score-lbl{font-size:11px;color:var(--text3);margin-top:2px}
  .section-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .5rem}
  .check-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer;background:var(--bg);transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
  .check-item:active{transform:scale(0.98)}
  .check-item.checked{border-color:var(--brown);background:var(--brown-light)}
  .checkbox{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg)}
  .check-item.checked .checkbox{background:var(--brown);border-color:var(--brown)}
  .check-label{font-size:14px;flex:1}
  .check-item.checked .check-label{color:var(--brown)}
  .save-btn{width:100%;padding:14px;border:none;border-radius:var(--radius);background:var(--brown);color:var(--beige);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px}
  .save-btn:active{background:var(--brown2)}
  .tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:0.5px solid var(--border);display:flex;z-index:50}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;cursor:pointer;font-size:11px;color:var(--text3);gap:3px;border:none;background:transparent;font-family:inherit}
  .tab-item.active{color:var(--brown)}
  .page{display:none}.page.active{display:block}
  .toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--brown);color:var(--beige);padding:10px 20px;border-radius:100px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
  .toast.show{opacity:1}
  .spinner{width:16px;height:16px;border:2px solid rgba(232,213,192,.4);border-top-color:var(--beige);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .form-group{display:flex;flex-direction:column;gap:4px}
  .form-group label{font-size:12px;color:var(--text2);font-weight:500}
  .form-group input,.form-group select,.form-group textarea{border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--brown)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .weekly-bar{display:flex;gap:4px;margin:8px 0}
  .wbar-cell{flex:1;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500}
  .loading-screen{text-align:center;padding:4rem 1rem;color:var(--text2)}
  .error-screen{text-align:center;padding:3rem 1rem;color:var(--text2);display:none}
</style>
</head>

          <div class="aluno-sub" id="top-sub">Programa 12 Semanas</div>
        </div>
        <div style="font-size:12px;color:rgba(232,213,192,0.7)" id="top-semana"></div>
      </div>
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="top-progress" style="width:0%"></div></div>
    </div>
  </div>

  <div id="page-daily" class="page active container">
    <div class="nav-weeks">
      <button class="nav-btn" onclick="changeWeek(-1)">‹ Semana</button>
      <span class="week-label" id="week-label-text">Semana 1</span>
      <button class="nav-btn" onclick="changeWeek(1)">Semana ›</button>
    </div>
    <div class="day-strip" id="day-strip"></div>
    <div class="score-row" id="score-row"></div>
    <div id="checks-container"></div>
    <p class="section-lbl">Anotações do dia</p>
    <textarea style="width:100%;border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit;resize:none;min-height:72px;margin-top:6px" id="note-input" placeholder="Como foi seu dia? Conquistas ou dificuldades..."></textarea>
    <button class="save-btn" id="save-btn" onclick="saveCheckin()">Salvar checklist do dia</button>
  </div>

  <div id="page-weekly" class="page container">
    <div class="nav-weeks">
      <button class="nav-btn" onclick="changeWeekW(-1)">‹</button>
      <span class="week-label" id="week-label-w">Semana 1</span>
      <button class="nav-btn" onclick="changeWeekW(1)">›</button>
    </div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:1rem">Registre seu progresso semanal.</p>
    <div style="display:flex;flex-direction:column;gap:10px" id="weekly-form"></div>
  </div>

  <div id="page-progress" class="page container">
    <h2 style="font-size:17px;font-weight:600;color:var(--brown);margin-bottom:1rem">Meu progresso</h2>
    <div id="progress-content"></div>
  </div>

  <div class="tab-bar">
    <button class="tab-item active" onclick="setTab('daily',this)"><span style="font-size:20px">✅</span><span>Hoje</span></button>
    <button class="tab-item" onclick="setTab('weekly',this)"><span style="font-size:20px">📊</span><span>Semanal</span></button>
    <button class="tab-item" onclick="setTab('progress',this)"><span style="font-size:20px">📈</span><span>Progresso</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = localStorage.getItem('sb_url') || 'COLE_SUA_URL_AQUI';
const SUPABASE_KEY = localStorage.getItem('sb_key') || 'COLE_SUA_CHAVE_AQUI';

async function sb(table,method='GET',body=null,filter=''){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${table}${filter}`,{method,headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':''},body:body?JSON.stringify(body):null});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||`Erro ${res.status}`);}
  return res.status===204?null:res.json();
}
async function sbUpsert(table,body){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||`Erro ${res.status}`);}
  return res.json();
}

const CHECKS=[
  {id:'agua',icon:'💧',label:'Consumiu a meta de água (2–3L)',section:'Hidratação'},
  {id:'sono',icon:'😴',label:'Dormiu pelo menos 7 horas',section:'Sono'},
  {id:'plano',icon:'🥗',label:'Seguiu o plano alimentar',section:'Alimentação'},
  {id:'acucar',icon:'🚫',label:'Sem açúcar ou doces em excesso',section:'Alimentação'},
  {id:'alcool',icon:'🍺',label:'Sem álcool',section:'Alimentação'},
  {id:'muscu',icon:'🏋️',label:'Treino de musculação realizado',section:'Treino'},
  {id:'cardio',icon:'🏃',label:'Aeróbico / caminhada / passos',section:'Treino'},
  {id:'mobilidade',icon:'🧘',label:'Mobilidade ou alongamento',section:'Movimento'},
  {id:'mente',icon:'🧠',label:'Cumpri meus compromissos hoje',section:'Mentalidade'},
  {id:'consistencia',icon:'🔥',label:'Mantive consistência mesmo sem motivação',section:'Mentalidade'},
];
const DIAS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

let alunoId=null,aluno=null,checkins={},monitoramento={},curWeek=1,curDay=0,curWeekW=1;

async function init(){
  const params=new URLSearchParams(window.location.search);
  alunoId=params.get('id');
  if(!alunoId){showError();return;}
  try{
    const res=await sb('alunos','GET',null,`?id=eq.${alunoId}&limit=1`);
    if(!res||!res.length){showError();return;}
    aluno=res[0];
    const inicio=aluno.semana_inicio?new Date(aluno.semana_inicio+'T12:00:00'):new Date();
    const diff=Math.floor((Date.now()-inicio.getTime())/(1000*60*60*24));
    curWeek=Math.min(12,Math.max(1,Math.floor(diff/7)+1));
    curDay=Math.min(6,Math.max(0,diff%7));
    const rows=await sb('checkins','GET',null,`?aluno_id=eq.${alunoId}`);
    (rows||[]).forEach(r=>{checkins[`${r.semana}_${r.dia}`]=r;});
    const mons=await sb('monitoramento','GET',null,`?aluno_id=eq.${alunoId}`);
    (mons||[]).forEach(r=>{monitoramento[r.semana]=r;});
    setupUI();
  }catch(e){showError();}
}

function showError(){document.getElementById('loading-screen').style.display='none';document.getElementById('error-screen').style.display='block';}

function setupUI(){
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('main-app').style.display='block';
  document.getElementById('top-nome').textContent=aluno.nome;
  document.title=`${aluno.nome.split(' ')[0]} · MC Consultoria`;
  renderDaily();renderWeeklyForm();updateTopProgress();
}

function updateTopProgress(){
  const total=Object.keys(checkins).length;
  document.getElementById('top-progress').style.width=Math.min(100,Math.round(total/84*100))+'%';
  document.getElementById('top-semana').textContent=`Semana ${curWeek}`;
  document.getElementById('top-sub').textContent=`${total} check-ins de 84`;
}

function changeWeek(d){curWeek=Math.max(1,Math.min(12,curWeek+d));curDay=0;renderDaily();}
function renderDaily(){document.getElementById('week-label-text').textContent=`Semana ${curWeek}`;renderDayStrip();renderChecks();}

function renderDayStrip(){
  document.getElementById('day-strip').innerHTML=DIAS.map((d,i)=>{
    const ck=checkins[`${curWeek}_${i}`];
    const score=ck?Object.values(ck.checks||{}).filter(Boolean).length:0;
    const done=score===CHECKS.length;
    return `<button class="day-btn${i===curDay?' active':''}${done?' done':''}" onclick="setDay(${i})">${d}<div style="font-size:10px;color:${done?'var(--teal)':score>0?'var(--amber)':'var(--text3)'}">${score}/${CHECKS.length}</div></button>`;
  }).join('');
}

function setDay(d){curDay=d;renderChecks();renderDayStrip();}

function renderChecks(){
  const checks=(checkins[`${curWeek}_${curDay}`]?.checks)||{};
  const score=Object.values(checks).filter(Boolean).length;
  const pct=Math.round(score/CHECKS.length*100);
  document.getElementById('score-row').innerHTML=`
    <div class="score-card"><div class="score-num">${score}/${CHECKS.length}</div><div class="score-lbl">itens hoje</div></div>
    <div class="score-card"><div class="score-num">${pct}%</div><div class="score-lbl">adesão</div></div>
    <div class="score-card"><div class="score-num" style="color:var(--teal)">${calcStreak()}</div><div class="score-lbl">dias seguidos</div></div>`;
  let sections={};CHECKS.forEach(c=>{if(!sections[c.section])sections[c.section]=[];sections[c.section].push(c);});
  let html='';
  Object.entries(sections).forEach(([sec,items])=>{
    html+=`<p class="section-lbl">${sec}</p>`;
    items.forEach(c=>{
      const checked=!!checks[c.id];
      html+=`<div class="check-item${checked?' checked':''}" onclick="toggleCheck('${c.id}')">
        <div class="checkbox">${checked?'<svg width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 5l3.5 3.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
        <span style="font-size:18px">${c.icon}</span>
        <span class="check-label">${c.label}</span>
      </div>`;
    });
  });
  document.getElementById('checks-container').innerHTML=html;
  document.getElementById('note-input').value=checkins[`${curWeek}_${curDay}`]?.nota||'';
}

function toggleCheck(id){
  const key=`${curWeek}_${curDay}`;
  if(!checkins[key])checkins[key]={checks:{},nota:''};
  checkins[key].checks[id]=!checkins[key].checks[id];
  renderChecks();renderDayStrip();
}

async function saveCheckin(){
  const btn=document.getElementById('save-btn');btn.innerHTML='<span class="spinner"></span> Salvando...';btn.disabled=true;
  const key=`${curWeek}_${curDay}`;
  if(!checkins[key])checkins[key]={checks:{},nota:''};
  checkins[key].nota=document.getElementById('note-input').value;
  try{
    await sbUpsert('checkins',{aluno_id:alunoId,semana:curWeek,dia:curDay,checks:checkins[key].checks,nota:checkins[key].nota});
    showToast('✅ Salvo!');updateTopProgress();
  }catch(e){showToast('Erro: '+e.message);}
  btn.innerHTML='Salvar checklist do dia';btn.disabled=false;
}

function calcStreak(){
  let s=0;
  for(let w=curWeek;w>=1;w--){
    for(let d=(w===curWeek?curDay:6);d>=0;d--){
      const ck=checkins[`${w}_${d}`];
      const score=ck?Object.values(ck.checks||{}).filter(Boolean).length:0;
      if(score>=7)s++;else return s;
    }
  }
  return s;
}

function changeWeekW(d){curWeekW=Math.max(1,Math.min(12,curWeekW+d));renderWeeklyForm();}

function renderWeeklyForm(){
  document.getElementById('week-label-w').textContent=`Semana ${curWeekW}`;
  const m=monitoramento[curWeekW]||{};
  const weekPcts=Array.from({length:7},(_,d)=>{const ck=checkins[`${curWeekW}_${d}`];return ck?Math.round(Object.values(ck.checks||{}).filter(Boolean).length/CHECKS.length*100):0;});
  const avg=Math.round(weekPcts.reduce((a,b)=>a+b,0)/7);
  const barColors=weekPcts.map(p=>p>=80?'#5C2E1A':p>=50?'#7A3E26':p>=30?'#B09080':p>0?'#F5EDE6':'var(--border)');
  const textColors=weekPcts.map(p=>p>=50?'#F5EDE6':'var(--text3)');
  const weekBar=DIAS.map((d,i)=>`<div class="wbar-cell" style="background:${barColors[i]};color:${textColors[i]}">${weekPcts[i]}%</div>`).join('');
  document.getElementById('weekly-form').innerHTML=`
    <div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:13px;color:var(--text2)">Adesão média</span><span style="font-size:15px;font-weight:600;color:${avg>=70?'var(--teal)':avg>=50?'var(--amber)':'var(--red)'}">${avg}%</span></div>
      <div class="weekly-bar">${weekBar}</div>
      <div style="display:flex;gap:4px">${DIAS.map(d=>`<div style="flex:1;text-align:center;font-size:9px;color:var(--text3)">${d}</div>`).join('')}</div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Peso atual (kg)</label><input id="wf-peso" type="number" step="0.1" placeholder="Ex: 82.5" value="${m.peso||''}"></div>
      <div class="form-group"><label>Circunf. abdominal (cm)</label><input id="wf-cintura" type="number" step="0.5" placeholder="Ex: 92" value="${m.cintura||''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Humor da semana</label><select id="wf-humor">${['Excelente','Bom','Regular','Difícil'].map(o=>`<option${m.humor===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-group"><label>Nível de energia</label><select id="wf-energia">${['Muito alto','Alto','Médio','Baixo'].map(o=>`<option${m.energia===o?' selected':''}>${o}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Controle da fome</label><select id="wf-fome">${['Ótimo','Bom','Regular','Difícil'].map(o=>`<option${m.controle_fome===o?' selected':''}>${o}</option>`).join('')}</select></div>
      <div class="form-group"><label>Treinos realizados</label><input id="wf-treinos" type="number" min="0" max="14" placeholder="Ex: 4" value="${m.treinos_semana||''}"></div>
    </div>
    <div class="form-group"><label>Fotos de evolução enviadas?</label><select id="wf-fotos">${['Sim','Não','Semana sem foto (ímpar)'].map(o=>`<option${(m.fotos_enviadas===true&&o==='Sim')||(m.fotos_enviadas===false&&o==='Não')?' selected':''}>${o}</option>`).join('')}</select></div>
    <div class="form-group"><label>Observações da semana</label><textarea id="wf-obs" style="min-height:80px;width:100%;border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit;resize:none" placeholder="Como foi? O que funcionou bem?">${m.obs||''}</textarea></div>
    <button class="save-btn" id="save-weekly-btn" onclick="saveWeekly()">Salvar monitoramento semanal</button>`;
}

async function saveWeekly(){
  const btn=document.getElementById('save-weekly-btn');btn.innerHTML='<span class="spinner"></span>';btn.disabled=true;
  try{
    const data={aluno_id:alunoId,semana:curWeekW,peso:parseFloat(document.getElementById('wf-peso').value)||null,cintura:parseFloat(document.getElementById('wf-cintura').value)||null,humor:document.getElementById('wf-humor').value,energia:document.getElementById('wf-energia').value,controle_fome:document.getElementById('wf-fome').value,treinos_semana:parseInt(document.getElementById('wf-treinos').value)||null,fotos_enviadas:document.getElementById('wf-fotos').value==='Sim',obs:document.getElementById('wf-obs').value};
    await sbUpsert('monitoramento',data);monitoramento[curWeekW]=data;showToast('✅ Monitoramento salvo!');
  }catch(e){showToast('Erro: '+e.message);}
  btn.innerHTML='Salvar monitoramento semanal';btn.disabled=false;
}

function renderProgress(){
  let totalDias=0,totalScore=0,maxStreak=0,curS=0;
  for(let w=1;w<=12;w++)for(let d=0;d<7;d++){const ck=checkins[`${w}_${d}`];const score=ck?Object.values(ck.checks||{}).filter(Boolean).length:0;if(score>0){totalDias++;totalScore+=score/CHECKS.length;}if(score>=7){curS++;maxStreak=Math.max(maxStreak,curS);}else curS=0;}
  const avgPct=totalDias?Math.round(totalScore/totalDias*100):0;
  const heatmap=Array.from({length:12},(_,w)=>Array.from({length:7},(_,d)=>{const ck=checkins[`${w+1}_${d}`];const s=ck?Object.values(ck.checks||{}).filter(Boolean).length/CHECKS.length:0;const bg=s>=1?'#5C2E1A':s>=0.7?'#7A3E26':s>=0.4?'#B09080':s>0?'#F5EDE6':'var(--border)';return `<div style="aspect-ratio:1;border-radius:2px;background:${bg}" title="Sem ${w+1} D${d+1}: ${Math.round(s*100)}%"></div>`;}).join('')).join('');
  const pesos=Array.from({length:12},(_,w)=>monitoramento[w+1]?.peso||null);
  const validP=pesos.filter(Boolean);
  let weightChart='<p style="font-size:13px;color:var(--text3)">Registre o peso na aba Semanal.</p>';
  if(validP.length>=2){const min=Math.min(...validP)-1,max=Math.max(...validP)+1,range=max-min||1;const pts=pesos.map((p,i)=>p?`${Math.round(i*(280/11))},${Math.round(90-(p-min)/range*70+10)}`:null).filter(Boolean).join(' ');const dots=pesos.map((p,i)=>{if(!p)return'';const x=Math.round(i*(280/11)),y=Math.round(90-(p-min)/range*70+10);return `<circle cx="${x}" cy="${y}" r="3.5" fill="#5C2E1A"/><text x="${x}" y="${y-7}" text-anchor="middle" font-size="9" fill="#5C2E1A">${p}kg</text>`;}).join('');weightChart=`<svg width="100%" viewBox="0 0 280 100" xmlns="http://www.w3.org/2000/svg" style="overflow:visible"><polyline points="${pts}" fill="none" stroke="#5C2E1A" stroke-width="2" stroke-linejoin="round"/>${dots}</svg>`;}
  document.getElementById('progress-content').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1.25rem">
      <div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center"><div style="font-size:22px;font-weight:600;color:var(--brown)">${totalDias}</div><div style="font-size:11px;color:var(--text3)">dias ativos</div></div>
      <div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center"><div style="font-size:22px;font-weight:600">${avgPct}%</div><div style="font-size:11px;color:var(--text3)">adesão média</div></div>
      <div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center"><div style="font-size:22px;font-weight:600;color:var(--teal)">${maxStreak}</div><div style="font-size:11px;color:var(--text3)">maior sequência</div></div>
    </div>
    <p class="section-lbl">Heatmap — 12 semanas</p>
    <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-bottom:1rem">${heatmap}</div>
    <p class="section-lbl">Evolução do peso</p>
    <div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:1rem">${weightChart}</div>
    <p class="section-lbl">Conquistas</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${[{label:'1ª semana ativa',earned:totalDias>=7},{label:'7 dias seguidos',earned:maxStreak>=7},{label:'1 mês completo',earned:totalDias>=28},{label:'21 dias seguidos',earned:maxStreak>=21},{label:'Mês de ferro',earned:totalDias>=56},{label:'12 semanas!',earned:totalDias>=84}].map(t=>`<div style="padding:6px 12px;border-radius:100px;font-size:12px;border:0.5px solid ${t.earned?'var(--brown)':'var(--border)'};background:${t.earned?'var(--brown-light)':'transparent'};color:${t.earned?'var(--brown)':'var(--text3)'}">${t.earned?'🏆':'🔒'} ${t.label}</div>`).join('')}
    </div>`;
}

function setTab(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');btn.classList.add('active');
  if(name==='progress')renderProgress();
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

init();
</script>
</body>
</html>
